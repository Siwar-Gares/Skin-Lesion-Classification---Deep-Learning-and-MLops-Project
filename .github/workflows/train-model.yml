name: Train Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of epochs'
        required: false
        default: '10'
      architecture:
        description: 'Model architecture'
        required: false
        default: 'efficientnet_b3'

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download dataset
      run: |
        echo "Dataset should be downloaded or mounted from external storage"
        echo "For CI/CD, use a small subset or mock data"
    
    - name: Train model
      run: |
        python train.py \
          --epochs ${{ github.event.inputs.epochs || '50' }} \
          --architecture ${{ github.event.inputs.architecture || 'efficientnet_b3' }} \
          --batch-size 32 \
          --lr 1e-4
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: checkpoints/best_model.pth
    
    - name: Upload training plots
      uses: actions/upload-artifact@v3
      with:
        name: training-plots
        path: checkpoints/training_curves.png
